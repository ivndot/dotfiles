source = ~/.config/hypr/mocha.conf

general {
  hide_cursor = true
}

# Background
background {
  #path = ~/Pictures/wallpaper_4.png
  color = rgba(10, 10, 10, 1.0)
}

# Password 
input-field {
    size = 250, 80
    outline_thickness = 2
    rounding = 6

    dots_center = true
    dots_spacing = 0.25

    outer_color = $surface0
    inner_color = $base
    font_color = $subtext1
    
    fade_on_empty = true
    placeholder_text = <i>Hi, $USER</i> # Text rendered in th>

    position = 170, 180
    halign = left
    valign = bottom
}

# DATE TIME HOUR 
label {
  monitor = 
  text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>" 
  color = $mauve
  position = 100, 100 
  font_size = 120
  font_family = JetBrainsMono Nerd Font
  halign = left
  valign = center
}

# DATE TIME MINUTE
label {
  text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
  color = $text
  monitor  = 
  font_family = JetBrainsMono Nerd Font
  font_size = 120
  position =  100, 240
  halign = left 
  valign = bottom 
}

# Power
label {
    monitor =
    text = 󰐥  󰜉  󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    position = 160, 100
    halign = left
    valign = bottom
}

# Uptime
label {
  monitor = 
  font_family = JetBrainsMono Nerd Font
  text = cmd[update:1000] echo "$(echo -e "Uptime" | uptime -p | sed -e 's/up //g')"
  color = $text
  font_size = 12
  position = -410, 130
  halign = right
  valign = bottom
}
